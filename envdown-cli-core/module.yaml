apply:
  - //templates/publishing.module-template.yaml

product:
  type: kmp/lib
  platforms: [
    linuxArm64,
    linuxX64,
    macosArm64,
    macosX64,
    mingwX64,
  ]

dependencies:
  - $libs.kotlinx.io
  - $libs.kotlin.stdlib

settings:
  kotlin:
    apiVersion: "2.4"
    languageVersion: "2.4"
    version: "2.4.21"
  publishing:
    artifactId: "envdown-cli-core"